name = "ldl-yizhan-api"
account_id = "YOUR_ACCOUNT_ID"
main = "workers/api/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "ldl-yizhan-db"
database_id = "YOUR_DATABASE_ID"

# 环境变量（部署时通过 wrangler secret put 设置）
# - ADMIN_TOKEN: 管理员写操作 token
# - AMAP_KEY:   高德地图 Web 端 JS API Key（前端需要的 key 直接放前端，
#               后端只需要在需要时校验或代理；这里保留位以备扩展）

# 前端静态资源：由本 Worker 直接托管（单页应用，未知路径回退 index.html）
[assets]
directory = "./public"
binding = "ASSETS"
# SPA 回退由 Worker 代码处理，避免边缘层拦截 API 请求

[observability]
enabled = true

[vars]
# 公共变量（敏感 token 走 secret）
CORS_ALLOW_ORIGIN = "*"
API_VERSION = "1.0.0"